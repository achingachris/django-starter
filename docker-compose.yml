# Production stack for both local Docker Compose and Dokploy.
#
# Local commands use .env.prod and publish the web service on localhost:8000.
# Dokploy sets APP_ENV_FILE=./.env and WEB_PUBLISHED_PORT=0; Traefik reaches
# the web service over the internal Docker network.
x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
    args:
      MY_UID: ${MY_UID:-1000}
      MY_GID: ${MY_GID:-1000}
  image: django-starter-app:latest
  env_file:
    - ${APP_ENV_FILE:-./.env.prod}
  restart: unless-stopped

services:
  db:
    image: postgres:17
    env_file:
      - ${APP_ENV_FILE:-./.env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    <<: *app
    command:
      - bash
      - -c
      - >-
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        exec gunicorn config.wsgi:application --bind 0.0.0.0:8000
        --workers $${GUNICORN_WORKERS:-3} --access-logfile - --error-logfile -
    ports:
      - "127.0.0.1:${WEB_PUBLISHED_PORT:-8000}:8000"
    volumes:
      - media_files:/code/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  media_files:
