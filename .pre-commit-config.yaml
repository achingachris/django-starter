exclude: ^static/.*|assets/.*|/migrations/.*|api-client/.*|\.min\.js$|\.min\.css$|\.css\.map$|\.js\.map$|\.svg$
default_stages: [pre-commit]
default_language_version:
   python: python3.14

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
        # tsconfig.json is JSONC (comments allowed), which strict JSON parsing rejects.
        exclude: ^tsconfig\.json$
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
  - repo: https://github.com/adamchainz/django-upgrade
    rev: "1.31.1"
    hooks:
      - id: django-upgrade
        args: ["--target-version", "6.0"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.15.6
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
  # >>> web
  - repo: https://github.com/djlint/djLint
    rev: v1.44.2
    hooks:
      # HTML email markup is whitespace-fragile (Outlook/MSO conditionals) and requires
      # inline style attributes (H021), so both djLint hooks skip templates/account/email/.
      - id: djlint-reformat-django
        exclude: ^templates/account/email/
      - id: djlint-django
        exclude: ^templates/account/email/
  # <<< web
