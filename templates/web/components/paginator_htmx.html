{% if is_paginated %}
  <div hx-target="#list-content">
    <div class="flex justify-center">
      <div class="mt-2 inline-flex -space-x-px">
        <a class="btn btn-outline btn-xs rounded-r-none"
           {% if page_obj.has_previous %} {% querystring page=page_obj.previous_page_number as previous_page %} hx-get="{{ previous_page }}" hx-push-url="true" {% else %} disabled {% endif %}>
          <span class="sr-only">Previous</span>
          <svg class="w-2.5 h-2.5 rtl:rotate-180"
               aria-hidden="true"
               xmlns="http://www.w3.org/2000/svg"
               fill="none"
               viewBox="0 0 6 10">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 1 1 5l4 4" />
          </svg>
        </a>
        {% for num in elided_page_range %}
          {% querystring page=num as num_page %}
          <a class="btn btn-outline btn-xs rounded-none {% if num == page_obj.number %}border-gray-900 bg-gray-900 text-white hover:bg-gray-900{% endif %}"
             {% if num != page_obj.number and num != page_obj.paginator.ELLIPSIS %} hx-get="{{ num_page }}" hx-push-url="true" {% elif num == page_obj.paginator.ELLIPSIS %} disabled {% endif %}>
            {{ num }}
          </a>
        {% endfor %}
        <a class="btn btn-outline btn-xs rounded-l-none"
           {% if page_obj.has_next %} {% querystring page=page_obj.next_page_number as next_page %} hx-get="{{ next_page }}" hx-push-url="true" {% else %} disabled {% endif %}>
          <span class="sr-only">Next</span>
          <svg class="w-2.5 h-2.5 rtl:rotate-180"
               aria-hidden="true"
               xmlns="http://www.w3.org/2000/svg"
               fill="none"
               viewBox="0 0 6 10">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 9 4-4-4-4" />
          </svg>
        </a>
      </div>
    </div>
  </div>
{% endif %}
