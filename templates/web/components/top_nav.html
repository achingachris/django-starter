{% load i18n %}

<div class="sticky top-0 z-50 border-b border-gray-200 bg-white/80 backdrop-blur-lg"
     x-data="{ mobileMenuOpen: false }">
  <div class="flex items-center justify-between px-4 py-3">
    <div class="flex-1 lg:hidden">
      <button @click="mobileMenuOpen = true" class="btn btn-ghost" aria-label="{% translate 'Open menu' %}">
        <svg xmlns="http://www.w3.org/2000/svg"
             class="h-5 w-5"
             fill="none"
             viewBox="0 0 24 24"
             stroke="currentColor"
             width="24"
             height="24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16" />
        </svg>
      </button>
    </div>
    <div class="hidden flex-1 justify-center lg:flex">
      <a class="px-3 py-2 text-sm font-medium {% if request.path == '/' %}text-gray-900{% else %}text-gray-500 hover:text-gray-900{% endif %}"
         href="{% url 'web:home' %}">{{ project_meta.NAME }}</a>
    </div>
    <div class="flex flex-1 items-center justify-end gap-2">
      <button id="pwa-install-button" class="btn btn-ghost btn-sm hidden" type="button">
        <i class="fa fa-download h-4 w-4"></i>
        {% translate "Install App" %}
      </button>
      {% if user.is_authenticated %}
      {% else %}
        <a href="{% url 'account_signup' %}" class="btn btn-primary">{% translate "Sign Up" %}</a>
        <a href="{% url 'account_login' %}" class="btn btn-outline">{% translate "Sign In" %}</a>
      {% endif %}
    </div>
  </div>
  <!-- Mobile drawer, teleported to body so it's not clipped by the sticky header -->
  <template x-teleport="body">
    <div x-show="mobileMenuOpen" x-cloak class="fixed inset-0 z-50 lg:hidden">
      <div x-show="mobileMenuOpen"
           x-transition:enter="transition ease-out duration-200"
           x-transition:enter-start="opacity-0"
           x-transition:enter-end="opacity-100"
           x-transition:leave="transition ease-in duration-150"
           x-transition:leave-start="opacity-100"
           x-transition:leave-end="opacity-0"
           @click="mobileMenuOpen = false"
           class="fixed inset-0 bg-black/30 backdrop-blur-sm"></div>
      <div x-show="mobileMenuOpen"
           x-transition:enter="transition ease-out duration-200"
           x-transition:enter-start="-translate-x-full"
           x-transition:enter-end="translate-x-0"
           x-transition:leave="transition ease-in duration-150"
           x-transition:leave-start="translate-x-0"
           x-transition:leave-end="-translate-x-full"
           class="fixed inset-y-0 left-0 w-64 overflow-y-auto bg-white shadow-xl">
        <div class="flex items-center justify-between border-b border-gray-200 p-4">
          <span class="text-lg font-semibold">{{ project_meta.NAME }}</span>
          <button @click="mobileMenuOpen = false" class="btn btn-ghost btn-sm" aria-label="{% translate 'Close menu' %}">
            <svg xmlns="http://www.w3.org/2000/svg"
                 class="h-5 w-5"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
        <ul class="space-y-1 p-4">
          {% block mobile_nav %}
            <li>
              <a class="nav-link {% if request.path == '/' %}nav-link-active{% endif %}"
                 href="{% url 'web:home' %}">{{ project_meta.NAME }}</a>
            </li>
          {% endblock %}
        </ul>
      </div>
    </div>
  </template>
</div>
