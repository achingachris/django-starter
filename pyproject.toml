[tool.ruff]
# Exclude a variety of commonly ignored directories.
extend-exclude = [
    ".direnv",
    ".git",
    ".ruff_cache",
    "node_modules",
    "migrations",
]
line-length = 120
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
fixable = [
    "ALL",
]
unfixable = []
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

# Third-party libraries without type stubs - explicitly list each to suppress import-untyped
[[tool.mypy.overrides]]
module = [
    "allauth.*",
    "environ.*",
    "sentry_sdk.*",
]
ignore_missing_imports = true

# Django admin files have known issues with decorators and type annotations
# Disable specific error codes that are problematic
[[tool.mypy.overrides]]
module = [
    "apps.*.admin",
]
disable_error_code = ["attr-defined", "assignment"]

[tool.django-stubs]
django_settings_module = "config.settings.dev"

# djLint checks/formats the Django templates (run via pre-commit).
[tool.djlint]
blank_line_after_tag = "load,extends"
close_void_tags = true
# allauth's {% element %} / {% slot %} block tags (templates/allauth/elements/) are
# unknown to djLint; without this it reports their end tags as unmatched (T038).
custom_blocks = "element,slot"
ignore = "H006,H030,H031"
include = "H017,H035"
indent = 2
max_line_length = 120
profile = "django"

[tool.setuptools]
py-modules = []

[project]
name = "chrisdevcode"
version = "0.1.0"
description = "my django template"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "Django>=6.1",
    "argon2-cffi>=25.1.0",
    "django-allauth[socialaccount]>=65.13.0",
    "django-environ",
    "django-htmx",
    "djangorestframework",
    "drf-spectacular",
    "psycopg",
    "redis",
    "requests",
]

[dependency-groups]
dev = [
    "django-browser-reload",
    "django-debug-toolbar",
    "django-watchfiles",
    "pre-commit",
    "ruff>=0.15.6",
    "psycopg[binary]",
    "mypy>=1.18.2",
    "django-stubs>=5.0.0",
    "djangorestframework-stubs>=3.15.0",
    "types-requests>=2.32.4",
    "django-loginout-panel>=0.1.0",
]
prod = [
    "gunicorn",
    "psycopg[c]",
    "sentry-sdk>=2.67.1",
    "whitenoise>=6.12.0",
]
